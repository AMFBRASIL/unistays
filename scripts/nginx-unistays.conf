# Config Nginx completo — site unistays.com.br (aaPanel)
#
# ONDE COLAR: Site → unistays.com.br → Config (ou arquivo vhost nginx do site)
# NÃO use proxy_pass em location / para a porta 3020 — isso causa o erro JSON
# "Rota GET / não encontrada" (só a API responde, não o React).
#
# Node Project no aaPanel (API apenas):
#   Path:     /www/wwwroot/unistays/backend
#   Comando:  npm  |  Args: run start   (ou PM2: Unistays)
#   Porta:    3020
#
server
{
    listen 80;
    listen 443 ssl;
    server_name unistays.com.br www.unistays.com.br;

    root /www/wwwroot/unistays/dist;
    index index.html;

    ssl_certificate    /www/server/panel/vhost/cert/unistays/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/unistays/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env|node_modules) {
        return 404;
    }

    location /.well-known/ {
        root /www/wwwroot/unistays/dist;
    }

    location = /deploy-hook {
        proxy_pass http://127.0.0.1:9876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/unistays.log;
    error_log   /www/wwwlogs/unistays.error.log;
}
